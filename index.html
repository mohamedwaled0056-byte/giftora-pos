/* 3- أسماء أنواع الحركات */

function getActivityTypeName26(action){
  const names={
    "login":"تسجيل دخول",
    "logout":"تسجيل خروج",
    "إضافة منتج":"إضافة منتج",
    "تعديل منتج":"تعديل منتج",
    "تغيير السعر الموحد":"تغيير سعر",
    "تعديل سعر فرع":"تعديل سعر فرع",
    "تسوية مخزون":"تعديل مخزون",
    "إنشاء نسخة احتياطية":"نسخة احتياطية",
    "استرجاع نسخة احتياطية":"استرجاع نسخة",
    "إضافة مصروف":"إضافة مصروف",
    "طلب خصم":"طلب خصم",
    "طلب إلغاء فاتورة":"طلب إلغاء",
    "الموافقة على طلب":"موافقة",
    "رفض طلب":"رفض طلب"
  };

  return names[action]||action||"حركة أخرى";
}

/* 4- فلترة سجل الحركات */

function filterActivity(){
  const employee=document.getElementById("activityEmployee26")?.value||"";
  const action=document.getElementById("activityType26")?.value||"";
  const from=document.getElementById("activityFrom26")?.value||"";
  const to=document.getElementById("activityTo26")?.value||"";

  let records=getVisibleActivity();

  if(employee){
    records=records.filter(a=>
      (a.user||a.username||a.employee||"")===employee
    );
  }

  if(action){
    records=records.filter(a=>
      (a.action||a.type||"")===action
    );
  }

  if(from){
    records=records.filter(a=>
      String(a.date||a.timestamp||a.time||"").slice(0,10)>=from
    );
  }

  if(to){
    records=records.filter(a=>
      String(a.date||a.timestamp||a.time||"").slice(0,10)<=to
    );
  }

  renderActivityTable26(records);
}

/* 5- عرض جدول الحركات */

function renderActivityTable26(records){
  const table=document.getElementById("activityTable26");

  if(!table) return;

  table.innerHTML=records.slice().reverse().map(a=>`
    <tr>
      <td>${escapeHTML(a.user||a.username||a.employee||"-")}</td>
      <td>${escapeHTML(getActivityTypeName26(a.action||a.type))}</td>
      <td>${escapeHTML(a.details||a.description||"-")}</td>
      <td>${escapeHTML(branchName(a.branchId))}</td>
      <td>${escapeHTML(a.timestamp||a.date||a.time||"-")}</td>
    </tr>
  `).join("") || `
    <tr>
      <td colspan="5">لا توجد حركات مطابقة</td>
    </tr>
  `;
}

/* 5- التأكد من وجود مخازن البيانات الأساسية */

function repairDatabaseStructure27(){
  const arrays=[
    "users",
    "branches",
    "products",
    "orders",
    "transfers",
    "expenses",
    "shifts",
    "requests",
    "activity",
    "priceHistory",
    "backups"
  ];

  arrays.forEach(key=>{
    if(!Array.isArray(db[key])){
      db[key]=[];
    }
  });

  if(!db.settings || typeof db.settings!=="object"){
    db.settings={
      storeName:"GIFTORA",
      currency:"جنيه",
      vatRate:20,
      nextInvoice:1
    };
  }

  if(!db.settings.nextInvoice){
    db.settings.nextInvoice=1;
  }

  saveDatabase();
}

/* 6- التحقق من صلاحية الوصول للفرع */

function canAccessBranch27(branchId){
  if(!currentUser) return false;

  if(isGeneral()) return true;

  if(isBranchManager() || isCashier()){
    return currentUser.branchId===branchId;
  }

  return false;
}

/* 7- التحقق من صلاحية تعديل المنتجات */

function canEditProduct27(){
  return !!currentUser && isGeneral();
}

/* 8- التحقق من صلاحية التحويل */

function canManageTransfer27(transfer){
  if(!currentUser || !transfer) return false;

  if(isGeneral()) return true;

  if(isBranchManager()){
    return transfer.fromBranch===currentUser.branchId ||
           transfer.toBranch===currentUser.branchId ||
           transfer.fromBranchId===currentUser.branchId ||
           transfer.toBranchId===currentUser.branchId;
  }

  return false;
}

/* 9- التحقق من صحة كمية المنتج */

function validQuantity27(value){
  const quantity=Number(value);

  return Number.isFinite(quantity) &&
         quantity>0;
}

/* 10- التحقق من السعر */

function validPrice27(value){
  const price=Number(value);

  return Number.isFinite(price) &&
         price>=0;
}

/* 11- حساب كمية المخزون بطريقة آمنة */

function safeProductQuantity27(product,branchId){
  if(!product || !branchId) return 0;

  if(product.stock &&
     typeof product.stock==="object"){
    return Math.max(0,Number(product.stock[branchId])||0);
  }

  if(product.quantities &&
     typeof product.quantities==="object"){
    return Math.max(0,Number(product.quantities[branchId])||0);
  }

  return 0;
}

/* 12- إصلاح بيانات لوحة الكاشير */

function getCashierOrders27(){
  if(!currentUser || !isCashier()) return [];

  return (db.orders||[]).filter(order=>{
    const belongs=
      order.branchId===currentUser.branchId;

    const belongsToCashier=
      order.cashierUser===currentUser.id ||
      order.createdByUser===currentUser.id ||
      order.createdBy===currentUser.id ||
      order.createdBy===currentUser.name;

    const unfinished=
      order.status==="pending" ||
      order.status==="paused";

    return belongs && belongsToCashier && unfinished;
  });
}

/* 13- حماية بيانات الطلبات */

function canViewOrder27(order){
  if(!currentUser || !order) return false;

  if(isGeneral()) return true;

  if(isBranchManager()){
    return order.branchId===currentUser.branchId;
  }

  if(isCashier()){
    return order.branchId===currentUser.branchId &&
      (
        order.status==="pending" ||
        order.status==="paused"
      );
  }

  return false;
}

/* 14- التحقق من صحة بيانات النسخ الاحتياطية القديمة */

function normalizeBackupData27(data){
  if(!data || typeof data!=="object") return null;

  const normalized={...data};

  const arrays=[
    "users",
    "branches",
    "products",
    "orders",
    "transfers",
    "expenses",
    "shifts",
    "requests",
    "activity",
    "priceHistory",
    "backups"
  ];

  arrays.forEach(key=>{
    if(!Array.isArray(normalized[key])){
      normalized[key]=[];
    }
  });

  if(!normalized.settings ||
     typeof normalized.settings!=="object"){
    normalized.settings={
      storeName:"GIFTORA",
      currency:"جنيه",
      vatRate:20,
      nextInvoice:1
    };
  }

  return normalized;
}

function validateApplication28(){

  if(!Array.isArray(db.products)) problems.push("المنتجات");

/* 7- تشغيل فحوصات البداية */

function initializeGiftora28(){

      return false;
    }

    repairDatabaseStructure27();
    ensureGeneralManager28();
