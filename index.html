<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123B68">
<meta name="description" content="Giftora POS - نظام إدارة المبيعات">
<title>Giftora POS</title>

<link rel="manifest" href="./manifest.json">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#EAF6FF;
  color:#18334d;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.container{max-width:1200px;margin:auto;padding:16px}
.card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 12px #123b6812;
}
.brand{
  color:#123B68;
  font-size:27px;
  font-weight:bold;
  text-align:center;
  margin:12px 0;
}
.subbrand{text-align:center;color:#6b8298;margin-bottom:22px}
.login-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}
.login-card{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:22px;
  padding:28px;
  box-shadow:0 8px 30px #123b6820;
}
input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #cbddea;
  border-radius:10px;
  margin:7px 0 14px;
  background:#fff;
  color:#18334d;
}
label{font-weight:bold;font-size:14px}
.btn{
  background:#123B68;
  color:white;
  padding:12px 18px;
  border-radius:10px;
  font-weight:bold;
}
.btn.secondary{background:#65B9E8;color:#123B68}
.btn.danger{background:#b83232}
.btn.light{background:#e5f3fc;color:#123B68}
.btn:disabled{opacity:.5;cursor:not-allowed}
.full{width:100%}
.topbar{
  background:#123B68;
  color:white;
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.topbar strong{font-size:20px}
.user-info{font-size:13px}
.layout{
  display:grid;
  grid-template-columns:220px 1fr;
  gap:15px;
  max-width:1400px;
  margin:auto;
  padding:15px;
}
.sidebar{
  background:white;
  border-radius:15px;
  padding:12px;
  height:max-content;
  position:sticky;
  top:12px;
}
.nav-btn{
  display:block;
  width:100%;
  text-align:right;
  padding:12px;
  margin:4px 0;
  border-radius:9px;
  background:white;
  color:#123B68;
}
.nav-btn:hover,.nav-btn.active{background:#EAF6FF;font-weight:bold}
.page-title{font-size:22px;color:#123B68;margin:4px 0 16px}
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
}
.stat{
  background:#fff;
  border-radius:14px;
  padding:16px;
  box-shadow:0 3px 12px #123b6812;
}
.stat small{color:#70869a}
.stat strong{display:block;font-size:22px;color:#123B68;margin-top:8px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:white}
th,td{padding:11px;border-bottom:1px solid #e3edf5;text-align:right;white-space:nowrap}
th{background:#eaf6ff;color:#123B68}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.notice{
  background:#fff7df;
  border:1px solid #f0d78a;
  padding:12px;
  border-radius:10px;
  color:#735b13;
  font-size:13px;
  margin-bottom:14px;
}
.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#eaf6ff;
  color:#123B68;
  font-size:12px;
}
@media(max-width:750px){
  .layout{grid-template-columns:1fr;padding:9px}
  .sidebar{position:static;display:flex;overflow-x:auto;gap:5px}
  .nav-btn{white-space:nowrap;width:auto}
  .grid2{grid-template-columns:1fr}
  .topbar{align-items:flex-start}
}
</style>
</head>

<body>

<!-- شاشة تسجيل الدخول -->
<section id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="brand">GIFTORA</div>
    <div class="subbrand">نظام إدارة المبيعات والفروع</div>

    <form id="loginForm">
      <label>اسم المستخدم</label>
      <input id="loginUsername" autocomplete="username"
             placeholder="اكتب اسم المستخدم" required>

      <label>كلمة المرور</label>
      <input id="loginPassword" type="password"
             autocomplete="current-password"
             placeholder="اكتب كلمة المرور" required>

      <button class="btn full" type="submit">تسجيل الدخول</button>
      <p id="loginMessage" style="color:#b83232;text-align:center"></p>
    </form>
  </div>
</section>

<!-- واجهة البرنامج -->
<section id="appScreen" class="hidden">
  <header class="topbar">
    <strong>GIFTORA POS</strong>
    <div class="user-info">
      <span id="currentUserName"></span>
      <span id="currentUserRole"></span>
      <button class="btn light" onclick="logout()">خروج</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main id="mainContent">
      <div class="notice">
        النسخة المحلية: البيانات محفوظة على هذا الجهاز والمتصفح فقط.
        لا توجد مزامنة تلقائية بين الأجهزة أو الفروع.
      </div>
      <h2 class="page-title">لوحة التحكم</h2>
      <div id="pageContent"></div>
    </main>
  </div>
</section>

<script>
"use strict";

/* =========================================
   GIFTORA POS - الجزء الأول: البيانات الأساسية
   ========================================= */

const STORAGE_KEY = "giftora_pos_local_v1";

const DEFAULT_DATA = {
  settings:{
    storeName:"GIFTORA",
    currency:"جنيه",
    vatRate:20,
    nextInvoice:1
  },

  users:[
    {
      id:"u_general",
      username:"المدير العام",
      password:"141220",
      name:"المدير العام",
      role:"general",
      branchId:null,
      active:true
    }
  ],

  branches:[],
  products:[],
  orders:[],
  transfers:[],
  expenses:[],
  shifts:[],
  requests:[],
  activity:[],
  priceHistory:[],
  backups:[]
};

let db = loadDatabase();
let currentUser = null;
let currentPage = "dashboard";

function loadDatabase(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(!saved) return structuredClone(DEFAULT_DATA);

    const parsed = JSON.parse(saved);

    // ضمان وجود الأقسام الأساسية عند تحديث النسخة
    Object.keys(DEFAULT_DATA).forEach(key=>{
      if(parsed[key] === undefined) parsed[key] =
        structuredClone(DEFAULT_DATA[key]);
    });

    return parsed;
  }catch(error){
    console.error("تعذر قراءة البيانات المحلية:",error);
    return structuredClone(DEFAULT_DATA);
  }
}

function saveDatabase(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
    return true;
  }catch(error){
    alert("تعذر حفظ البيانات. مساحة التخزين قد تكون ممتلئة.");
    console.error(error);
    return false;
  }
}

function makeId(prefix="id"){
  return prefix+"_"+Date.now().toString(36)+"_"+
    Math.random().toString(36).slice(2,8);
}

function today(){
  const d = new Date();
  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");
}

function nowText(){
  return new Date().toLocaleString("ar-EG");
}

function money(value){
  return (Number(value)||0).toLocaleString("ar-EG",{
    maximumFractionDigits:2
  })+" "+db.settings.currency;
}

function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,char=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function logActivity(action,details=""){
  db.activity.unshift({
    id:makeId("log"),
    userId:currentUser?.id||null,
    username:currentUser?.username||"النظام",
    role:currentUser?.role||"system",
    branchId:currentUser?.branchId||null,
    action,
    details,
    date:nowText(),
    timestamp:Date.now()
  });
  saveDatabase();
}

/* صلاحيات الأدوار */
const ROLE_NAMES = {
  general:"المدير العام",
  branch:"مدير فرع",
  cashier:"كاشير"
};

function isGeneral(){
  return currentUser?.role==="general";
}
function isBranchManager(){
  return currentUser?.role==="branch";
}
function isCashier(){
  return currentUser?.role==="cashier";
}
function canManagePrices(){
  return isGeneral();
}
function canManageBranches(){
  return isGeneral();
}
function canManageUsers(){
  return isGeneral();
}
function canCreateTransfer(){
  return isGeneral()||isBranchManager();
}
function canApproveRequests(){
  return isGeneral();
}

/* نهاية الجزء الأول - لا تغلق وسم script هنا *//* =========================================
   GIFTORA POS - الجزء الثاني
   تسجيل الدخول والصلاحيات والقائمة الرئيسية
   ========================================= */

/* التحقق من صلاحية المستخدم */
function authenticate(username,password){
  const user = db.users.find(u=>
    u.username.trim()===username.trim() &&
    u.password===password &&
    u.active===true
  );

  if(!user) return null;

  if(user.role!=="general"){
    const branch = db.branches.find(b=>b.id===user.branchId);
    if(!branch || branch.active===false) return null;
  }

  return user;
}

/* تسجيل الدخول */
document.getElementById("loginForm").addEventListener("submit",function(e){
  e.preventDefault();

  const username=document.getElementById("loginUsername").value;
  const password=document.getElementById("loginPassword").value;
  const message=document.getElementById("loginMessage");

  const user=authenticate(username,password);

  if(!user){
    message.textContent="اسم المستخدم أو كلمة المرور غير صحيحة أو الحساب موقوف";
    return;
  }

  currentUser=user;
  message.textContent="";

  logActivity("تسجيل دخول","تم تسجيل الدخول بنجاح");

  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("appScreen").classList.remove("hidden");

  document.getElementById("currentUserName").textContent=user.name+" ";
  document.getElementById("currentUserRole").textContent=
    " - "+ROLE_NAMES[user.role];

  renderSidebar();
  showPage("dashboard");
});

/* تسجيل الخروج */
function logout(){
  if(currentUser){
    logActivity("تسجيل خروج");
  }

  currentUser=null;
  currentPage="dashboard";

  document.getElementById("appScreen").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");

  document.getElementById("loginPassword").value="";
  document.getElementById("loginUsername").value="";
  document.getElementById("loginMessage").textContent="";
}

/* عناصر القائمة حسب الدور */
function getMenuItems(){
  if(isGeneral()){
    return [
      ["dashboard","لوحة التحكم"],
      ["branches","إدارة الفروع"],
      ["users","المستخدمون والصلاحيات"],
      ["products","المنتجات والأسعار"],
      ["inventory","المخزون"],
      ["transfers","تحويلات الفروع"],
      ["orders","الأوردرات والفواتير"],
      ["sales","سجل المبيعات"],
      ["requests","طلبات الخصم والإلغاء"],
      ["accounts","الحسابات والأرباح"],
      ["expenses","المصروفات"],
      ["shifts","الورديات والخزائن"],
      ["employees","حركة الموظفين"],
      ["reports","التقارير"],
      ["forecast","التوقعات"],
      ["backup","النسخ الاحتياطي"]
    ];
  }

  if(isBranchManager()){
    return [
      ["dashboard","لوحة الفرع"],
      ["inventory","مخزون الفرع"],
      ["transfers","تحويلات الفرع"],
      ["orders","أوردرات الفرع"],
      ["sales","سجل المبيعات"],
      ["shifts","الورديات والخزنة"],
      ["employees","موظفو الفرع"]
    ];
  }

  return [
    ["dashboard","شاشة الكاشير"],
    ["orders","الأوردرات الحالية"]
  ];
}

/* إنشاء القائمة */
function renderSidebar(){
  const sidebar=document.getElementById("sidebar");
  sidebar.innerHTML="";

  getMenuItems().forEach(item=>{
    const button=document.createElement("button");
    button.className="nav-btn"+(currentPage===item[0]?" active":"");
    button.textContent=item[1];
    button.onclick=()=>showPage(item[0]);
    sidebar.appendChild(button);
  });
}

/* التحقق من صلاحية فتح الشاشة */
function canOpenPage(page){
  const allowed=getMenuItems().map(item=>item[0]);
  return allowed.includes(page);
}

/* فتح شاشة */
function showPage(page){
  if(!currentUser) return;

  if(!canOpenPage(page)){
    alert("ليس لديك صلاحية للوصول إلى هذه الشاشة");
    return;
  }

  currentPage=page;
  renderSidebar();

  const content=document.getElementById("pageContent");
  content.innerHTML="";

  switch(page){

    case "dashboard":
      renderDashboard(content);
      break;

    case "branches":
      renderBranches(content);
      break;

    case "users":
      renderUsers(content);
      break;

    case "products":
      renderProducts(content);
      break;

    case "inventory":
      renderInventory(content);
      break;

    case "transfers":
      renderTransfers(content);
      break;

    case "orders":
      renderOrders(content);
      break;

    case "sales":
      renderSales(content);
      break;

    case "requests":
      renderRequests(content);
      break;

    case "accounts":
      renderAccounts(content);
      break;

    case "expenses":
      renderExpenses(content);
      break;

    case "shifts":
      renderShifts(content);
      break;

    case "employees":
      renderEmployees(content);
      break;

    case "reports":
      renderReports(content);
      break;

    case "forecast":
      renderForecast(content);
      break;

    case "backup":
      renderBackup(content);
      break;

    default:
      content.innerHTML="<div class='card'>الشاشة غير متاحة</div>";
  }
}

/* اسم الفرع */
function branchName(branchId){
  const branch=db.branches.find(b=>b.id===branchId);
  return branch?branch.name:"بدون فرع";
}

/* تحديد بيانات الفرع الحالي */
function getCurrentBranchId(){
  return currentUser?.branchId||null;
}

/* التأكد من أن المستخدم يرى بيانات فرعه فقط */
function belongsToCurrentBranch(record){
  if(isGeneral()) return true;
  return record.branchId===getCurrentBranchId();
}

/* لوحة التحكم */
function renderDashboard(container){
  const branchId=getCurrentBranchId();

  const orders=db.orders.filter(o=>{
    if(isGeneral()) return true;
    return o.branchId===branchId;
  });

  const completed=orders.filter(o=>o.status==="completed");

  const totalSales=completed.reduce((sum,o)=>sum+Number(o.total||0),0);

  const pending=orders.filter(o=>
    o.status==="pending"||o.status==="paused"
  ).length;

  const products=db.products.filter(p=>{
    if(isGeneral()) return true;
    return true;
  });

  let html=`
    <div class="notice">
      ${isGeneral()
        ?"أنت تعمل بصلاحية المدير العام وتستطيع إدارة جميع الفروع."
        :isBranchManager()
          ?"أنت تعمل بصلاحية مدير الفرع: "+escapeHTML(branchName(branchId))
          :"أنت تعمل بصلاحية الكاشير في فرع "+escapeHTML(branchName(branchId))
      }
    </div>

    <div class="stats">
      <div class="stat">
        <small>إجمالي الأوردرات المكتملة</small>
        <strong>${completed.length}</strong>
      </div>

      <div class="stat">
        <small>إجمالي المبيعات</small>
        <strong>${money(totalSales)}</strong>
      </div>

      <div class="stat">
        <small>الأوردرات غير المكتملة</small>
        <strong>${pending}</strong>
      </div>

      <div class="stat">
        <small>عدد المنتجات</small>
        <strong>${products.length}</strong>
      </div>
    </div>
  `;

  if(isGeneral()){
    html+=`
      <div class="card">
        <h3>ملخص الفروع</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>الفرع</th>
                <th>الحالة</th>
                <th>عدد الأوردرات</th>
                <th>المبيعات</th>
              </tr>
            </thead>
            <tbody>
              ${db.branches.map(b=>{
                const branchOrders=completed.filter(o=>o.branchId===b.id);
                const sales=branchOrders.reduce((s,o)=>s+Number(o.total||0),0);

                return `
                  <tr>
                    <td>${escapeHTML(b.name)}</td>
                    <td>${b.active?"نشط":"موقوف"}</td>
                    <td>${branchOrders.length}</td>
                    <td>${money(sales)}</td>
                  </tr>
                `;
              }).join("")}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  if(isCashier()){
    html+=`
      <div class="card">
        <h3>ابدأ البيع</h3>
        <button class="btn full" onclick="showPage('orders')">
          فتح شاشة الأوردرات
        </button>
      </div>
    `;
  }

  container.innerHTML=html;
}

/* أدوات مساعدة */
function showMessage(message){
  alert(message);
}

function confirmAction(message){
  return confirm(message);
}

function formatDate(date){
  return new Date(date).toLocaleDateString("ar-EG");
}

/* نهاية الجزء الثاني */
/* =========================================
   GIFTORA POS - الجزء الثالث
   إدارة الفروع والمستخدمين
   ========================================= */

/* عرض الفروع */
function renderBranches(container){
  if(!isGeneral()){
    container.innerHTML="<div class='card'>غير مسموح لك بإدارة الفروع</div>";
    return;
  }

  container.innerHTML=`
    <h2 class="page-title">إدارة الفروع</h2>

    <div class="card">
      <h3>إضافة فرع جديد</h3>

      <label>اسم الفرع</label>
      <input id="newBranchName" placeholder="مثال: فرع مدينة نصر">

      <label>عنوان الفرع</label>
      <input id="newBranchAddress" placeholder="عنوان الفرع">

      <button class="btn full" onclick="addBranch()">
        إنشاء الفرع
      </button>
    </div>

    <div class="card">
      <h3>الفروع المسجلة</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>اسم الفرع</th>
              <th>العنوان</th>
              <th>الحالة</th>
              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody>
            ${db.branches.map(b=>`
              <tr>
                <td>${escapeHTML(b.name)}</td>
                <td>${escapeHTML(b.address||"-")}</td>
                <td>${b.active?"نشط":"موقوف"}</td>
                <td>
                  <div class="actions">
                    <button class="btn light"
                      onclick="toggleBranch('${b.id}')">
                      ${b.active?"إيقاف":"تفعيل"}
                    </button>
                    <button class="btn secondary"
                      onclick="editBranch('${b.id}')">
                      تعديل
                    </button>
                  </div>
                </td>
              </tr>
            `).join("")||"<tr><td colspan='4'>لا توجد فروع حتى الآن</td></tr>"}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

/* إضافة فرع */
function addBranch(){
  if(!canManageBranches()) return;

  const name=document.getElementById("newBranchName").value.trim();
  const address=document.getElementById("newBranchAddress").value.trim();

  if(!name){
    alert("اكتب اسم الفرع");
    return;
  }

  if(db.branches.some(b=>b.name.toLowerCase()===name.toLowerCase())){
    alert("اسم الفرع موجود بالفعل");
    return;
  }

  db.branches.push({
    id:makeId("branch"),
    name,
    address,
    active:true,
    createdAt:nowText(),
    createdBy:currentUser.id
  });

  saveDatabase();
  logActivity("إنشاء فرع",name);
  showPage("branches");
}

/* تعديل فرع */
function editBranch(id){
  if(!canManageBranches()) return;

  const branch=db.branches.find(b=>b.id===id);
  if(!branch) return;

  const name=prompt("اسم الفرع الجديد:",branch.name);
  if(name===null) return;

  if(!name.trim()){
    alert("اسم الفرع لا يمكن أن يكون فارغًا");
    return;
  }

  const address=prompt("عنوان الفرع:",branch.address||"");
  if(address===null) return;

  branch.name=name.trim();
  branch.address=address.trim();

  saveDatabase();
  logActivity("تعديل بيانات فرع",branch.name);
  showPage("branches");
}

/* إيقاف وتفعيل فرع */
function toggleBranch(id){
  if(!canManageBranches()) return;

  const branch=db.branches.find(b=>b.id===id);
  if(!branch) return;

  if(!confirmAction(
    branch.active?"هل تريد إيقاف هذا الفرع؟":"هل تريد تفعيل هذا الفرع؟"
  )) return;

  branch.active=!branch.active;

  saveDatabase();
  logActivity("تغيير حالة فرع",branch.name);
  showPage("branches");
}

/* عرض المستخدمين */
function renderUsers(container){
  if(!canManageUsers()){

/* تغيير حقل الفرع حسب نوع الحساب */
function updateUserBranchField(){

  field.style.display=role==="general"?"none":"block";

/* إنشاء مستخدم */
function addUser(){
  if(!canManageUsers()) return;

  const username=document.getElementById("newUsername").value.trim();
  const name=document.getElementById("newUserName").value.trim();
  const password=document.getElementById("newUserPassword").value;
  const role=document.getElementById("newUserRole").value;
  const branchId=document.getElementById("newUserBranch").value;

  if(!username||!name||!password){
    alert("يرجى استكمال جميع البيانات");
    return;
  }

  if(password.length<4){
    alert("كلمة المرور يجب ألا تقل عن 4 أحرف أو أرقام");
    return;
  }

  if(db.users.some(u=>u.username.toLowerCase()===username.toLowerCase())){
    alert("اسم المستخدم مستخدم بالفعل");
    return;
  }

  if(!["cashier","branch"].includes(role)){
    alert("نوع الحساب غير صحيح");
    return;
  }

  if(!branchId){
    alert("اختر الفرع التابع له المستخدم");
    return;
  }

  const branch=db.branches.find(b=>b.id===branchId&&b.active);
  if(!branch){
    alert("الفرع غير موجود أو موقوف");
    return;
  }

  db.users.push({
    id:makeId("user"),
    username,
    name,
    password,
    role,
    branchId,
    active:true,
    createdAt:nowText(),
    createdBy:currentUser.id
  });

  saveDatabase();
  logActivity("إنشاء مستخدم",username+" - "+ROLE_NAMES[role]);
  alert("تم إنشاء الحساب بنجاح");
  showPage("users");
}

/* تعديل بيانات المستخدم */
function editUser(id){
  if(!canManageUsers()) return;

  const user=db.users.find(u=>u.id===id);
  if(!user||user.role==="general") return;

  const name=prompt("الاسم الظاهر:",user.name);
  if(name===null) return;

  if(!name.trim()){
    alert("الاسم مطلوب");
    return;
  }

  const username=prompt("اسم المستخدم:",user.username);
  if(username===null) return;

  if(!username.trim()){
    alert("اسم المستخدم مطلوب");
    return;
  }

  const duplicate=db.users.some(u=>
    u.id!==id&&u.username.toLowerCase()===username.trim().toLowerCase()
  );

  if(duplicate){
    alert("اسم المستخدم موجود بالفعل");
    return;
  }

  const role=prompt(
    "اكتب cashier للكاشير أو branch لمدير الفرع:",
    user.role
  );

  if(role===null) return;

  if(!["cashier","branch"].includes(role)){
    alert("نوع الحساب غير صحيح");
    return;
  }

  const activeBranches=db.branches.filter(b=>b.active);

  const branchOptions=activeBranches.map((b,i)=>
    (i+1)+" - "+b.name
  ).join("\n");

  if(!activeBranches.length){
    alert("لا توجد فروع نشطة");
    return;
  }

  const selected=prompt(
    "اختر رقم الفرع:\n"+branchOptions,
    String(Math.max(1,activeBranches.findIndex(b=>b.id===user.branchId)+1))
  );

  if(selected===null) return;

  const index=Number(selected)-1;
  const branch=activeBranches[index];

  if(!branch){
    alert("اختيار الفرع غير صحيح");
    return;
  }

  user.name=name.trim();
  user.username=username.trim();
  user.role=role;
  user.branchId=branch.id;

  saveDatabase();
  logActivity("تعديل مستخدم",user.username);
  showPage("users");
}

/* إيقاف وتفعيل حساب */
function toggleUser(id){
  if(!canManageUsers()) return;

  const user=db.users.find(u=>u.id===id);
  if(!user||user.role==="general") return;

  if(!confirmAction(
    user.active?"هل تريد إيقاف الحساب؟":"هل تريد تفعيل الحساب؟"
  )) return;

  user.active=!user.active;

  saveDatabase();
  logActivity("تغيير حالة مستخدم",user.username);
  showPage("users");
}

/* تغيير كلمة مرور المستخدم */
function changeUserPassword(id){
  if(!canManageUsers()) return;

  const user=db.users.find(u=>u.id===id);
  if(!user||user.role==="general") return;

  const password=prompt("اكتب كلمة المرور الجديدة:");
  if(password===null) return;

  if(password.length<4){
    alert("كلمة المرور قصيرة جدًا");
    return;
  }

  user.password=password;

  saveDatabase();
  logActivity("تغيير كلمة مرور مستخدم",user.username);
  alert("تم تغيير كلمة المرور");
  showPage("users");
}

/* الحصول على سعر المنتج حسب الفرع */
function getProductPrice(product,branchId){
  const special=product.branchPrices?.[branchId];

  if(special!==undefined && special!==null && special!==""){
    return Number(special);
  }

  return Number(product.price||0);
}

/* الحصول على كمية المنتج في فرع */
function getProductQuantity(product,branchId){
  return Number(product.stock?.[branchId]||0);
}

/* إضافة منتج */
function addProduct(){
  if(!canManagePrices()) return;

  const name=document.getElementById("productName").value.trim();
  const code=document.getElementById("productCode").value.trim();
  const cost=Number(document.getElementById("productCost").value);
  const price=Number(document.getElementById("productPrice").value);
  const qty=Number(document.getElementById("productInitialQty").value);

  if(!name){
    alert("اكتب اسم المنتج");
    return;
  }

  if(!Number.isFinite(cost)||cost<0||
     !Number.isFinite(price)||price<0||
     !Number.isFinite(qty)||qty<0){
    alert("راجع التكلفة والسعر والكمية");
    return;
  }

  if(db.products.some(p=>p.name.toLowerCase()===name.toLowerCase())){
    alert("المنتج موجود بالفعل");
    return;
  }

  if(code && db.products.some(p=>p.code===code)){
    alert("كود المنتج مستخدم بالفعل");
    return;
  }

  const stock={};

  db.branches.forEach(b=>{
    stock[b.id]=qty;
  });

  const product={
    id:makeId("product"),
    name,
    code,
    cost,
    price,
    branchPrices:{},
    stock,
    active:true,
    createdAt:nowText(),
    createdBy:currentUser.id
  };

  db.products.push(product);

  saveDatabase();
  logActivity("إضافة منتج",name);
  alert("تم إضافة المنتج");
  showPage("products");
}

/* تعديل بيانات المنتج */
function editProduct(id){

  if(!p) return;

  }

  p.cost=cost;

  saveDatabase();

  showPage("products");
}

/* تغيير السعر الموحد */
function changeGlobalPrice(product,newPrice){
  if(!canManagePrices()) return false;

  newPrice=Number(newPrice);

  if(!Number.isFinite(newPrice)||newPrice<0) return false;

  const oldPrice=Number(product.price||0);

  product.price=newPrice;

  db.priceHistory.push({
    id:makeId("price"),
    productId:product.id,
    productName:product.name,
    type:"سعر موحد",
    oldPrice,
    newPrice,
    branchId:null,
    branchName:"كل الفروع",
    username:currentUser.username,
    date:nowText()
  });

  logActivity("تغيير السعر الموحد",product.name);
  return true;
}

/* تغيير سعر خاص بفرع */
function setBranchPrice(productId){
  if(!canManagePrices()) return;

  const product=db.products.find(p=>p.id===productId);
  if(!product) return;

  const activeBranches=db.branches.filter(b=>b.active);

  if(!activeBranches.length){
    alert("لا توجد فروع نشطة");
    return;
  }

  const options=activeBranches.map((b,i)=>
    (i+1)+" - "+b.name
  ).join("\n");

  const choice=prompt("اختر الفرع:\n"+options);
  if(choice===null) return;

  const branch=activeBranches[Number(choice)-1];

  if(!branch){
    alert("اختيار الفرع غير صحيح");
    return;
  }

  const current=product.branchPrices?.[branch.id];
  const defaultPrice= current??product.price;

  const value=prompt(
    "السعر الخاص بفرع "+branch.name+
    "\nاكتب السعر الجديد، أو اكتب حذف لاستخدام السعر الموحد:",
    defaultPrice
  );

  if(value===null) return;

  if(value.trim()==="حذف"){
    const oldPrice=current??product.price;

    delete product.branchPrices[branch.id];

    db.priceHistory.push({
      id:makeId("price"),
      productId:product.id,
      productName:product.name,
      type:"إلغاء السعر الخاص",
      oldPrice,
      newPrice:product.price,
      branchId:branch.id,
      branchName:branch.name,
      username:currentUser.username,
      date:nowText()
    });

  }else{
    const newPrice=Number(value);

    if(!Number.isFinite(newPrice)||newPrice<0){
      alert("السعر غير صحيح");
      return;
    }

    const oldPrice=current??product.price;

    product.branchPrices=product.branchPrices||{};
    product.branchPrices[branch.id]=newPrice;

    db.priceHistory.push({
      id:makeId("price"),
      productId:product.id,
      productName:product.name,
      type:"سعر خاص",
      oldPrice,
      newPrice,
      branchId:branch.id,
      branchName:branch.name,
      username:currentUser.username,
      date:nowText()
    });
  }

  saveDatabase();
  logActivity("تعديل سعر فرع",product.name+" - "+branch.name);
  showPage("products");
}

/* تحديث جدول المخزون */
function refreshInventory(){
  const rows=document.getElementById("inventoryRows");
  if(!rows) return;

  const branchId=isGeneral()
    ?document.getElementById("inventoryBranch")?.value
    :currentUser.branchId;

  if(!branchId){
    rows.innerHTML="<tr><td colspan='5'>اختر فرعًا</td></tr>";
    return;
  }

  const branch=db.branches.find(b=>b.id===branchId);

  rows.innerHTML=db.products.filter(p=>p.active).map(p=>{
    const qty=getProductQuantity(p,branchId);
    const price=getProductPrice(p,branchId);

    return `
      <tr>
        <td>${escapeHTML(p.name)}</td>
        <td>${escapeHTML(branch?.name||"-")}</td>
        <td>${qty}</td>
        <td>${money(price)}</td>
        <td>${money(qty*Number(p.cost||0))}</td>
      </tr>
    `;
  }).join("")||"<tr><td colspan='5'>لا توجد منتجات</td></tr>";
}

/* تعديل كمية المخزون يدويًا */
function adjustStock(productId,branchId,newQty,reason="تسوية مخزون"){
  if(!isGeneral()&&!isBranchManager()) return false;

  if(isBranchManager()&&branchId!==currentUser.branchId){
    alert("لا يمكنك تعديل مخزون فرع آخر");
    return false;
  }

  const product=db.products.find(p=>p.id===productId);
  const branch=db.branches.find(b=>b.id===branchId);

  newQty=Number(newQty);

  if(!product||!branch||!Number.isFinite(newQty)||newQty<0){
    alert("بيانات المخزون غير صحيحة");
    return false;
  }

  product.stock=product.stock||{};

  const oldQty=Number(product.stock[branchId]||0);
  product.stock[branchId]=newQty;

  saveDatabase();

  logActivity(
    "تعديل كمية مخزون",
    product.name+" - "+branch.name+
    " - من "+oldQty+" إلى "+newQty+
    " - "+reason
  );

  return true;
}

/* اسم حالة التحويل */
function transferStatusName(status){
  const names={
    pending:"طلب جديد",
    shipped:"تم تأكيد الخروج",
    received:"تم الاستلام",
    cancelled:"ملغي"
  };

  return names[status]||status;
}

/* أزرار التحويل حسب الصلاحية والحالة */
function renderTransferActions(t){
  const actions=[];

  const canShip=isGeneral()||
    (isBranchManager()&&currentUser.branchId===t.fromBranchId);

  const canReceive=isGeneral()||
    (isBranchManager()&&currentUser.branchId===t.toBranchId);

  if(t.status==="pending"&&canShip){
    actions.push(`
      <button class="btn secondary"
        onclick="shipTransfer('${t.id}')">
        تأكيد الخروج
      </button>
    `);
  }

  if(t.status==="shipped"&&canReceive){
    actions.push(`
      <button class="btn"
        onclick="receiveTransfer('${t.id}')">
        تأكيد الاستلام
      </button>
    `);
  }

  if(t.status==="pending"&&isGeneral()){
    actions.push(`
      <button class="btn danger"
        onclick="cancelTransfer('${t.id}')">
        إلغاء
      </button>
    `);
  }

  return actions.join("")||"<span class='badge'>لا توجد إجراءات</span>";
}

/* إنشاء تحويل */
function createTransfer(){
  if(!canCreateTransfer()) return;

  const fromBranchId=document.getElementById("transferFrom").value;
  const toBranchId=document.getElementById("transferTo").value;
  const productId=document.getElementById("transferProduct").value;
  const qty=Number(document.getElementById("transferQty").value);
  const notes=document.getElementById("transferNotes").value.trim();

  if(!fromBranchId||!toBranchId||!productId){
    alert("اختر الفرع المرسل والمستلم والمنتج");
    return;
  }

  if(fromBranchId===toBranchId){
    alert("لا يمكن تحويل المنتجات إلى نفس الفرع");
    return;
  }

  if(isBranchManager()&&
    (fromBranchId!==currentUser.branchId||
     toBranchId!==currentUser.branchId)){
    alert("مدير الفرع يستطيع إنشاء تحويل مرتبط بفرعه فقط");
    return;
  }

  if(!Number.isInteger(qty)||qty<=0){
    alert("اكتب كمية صحيحة");
    return;
  }

  const fromBranch=db.branches.find(b=>
    b.id===fromBranchId&&b.active
  );

  const toBranch=db.branches.find(b=>
    b.id===toBranchId&&b.active
  );

  const product=db.products.find(p=>
    p.id===productId&&p.active
  );

  if(!fromBranch||!toBranch||!product){
    alert("بيانات الفرع أو المنتج غير صحيحة");
    return;
  }

  const available=getProductQuantity(product,fromBranchId);

  const reserved=db.transfers
    .filter(t=>
      t.fromBranchId===fromBranchId&&
      t.productId===productId&&
      t.status==="pending"
    )
    .reduce((sum,t)=>sum+Number(t.qty),0);

  if(available-reserved<qty){
    alert("الكمية المتاحة غير كافية بعد احتساب طلبات التحويل المعلقة");
    return;
  }

  const transfer={
    id:makeId("transfer"),
    transferNo:"TR-"+Date.now(),
    fromBranchId,
    toBranchId,
    productId,
    productName:product.name,
    qty,
    notes,
    status:"pending",
    createdBy:currentUser.id,
    createdByName:currentUser.name,
    createdAt:nowText(),
    shippedAt:null,
    shippedBy:null,
    receivedAt:null,
    receivedBy:null
  };

  db.transfers.push(transfer);

  saveDatabase();
  logActivity(
    "إنشاء طلب تحويل",
    product.name+" - "+qty+
    " من "+fromBranch.name+" إلى "+toBranch.name
  );

  alert("تم إنشاء طلب التحويل");
  showPage("transfers");
}

/* تأكيد خروج المنتجات */
function shipTransfer(id){
  if(!canCreateTransfer()) return;

  const transfer=db.transfers.find(t=>t.id===id);
  if(!transfer||transfer.status!=="pending") return;

  if(!isGeneral()&&
    currentUser.branchId!==transfer.fromBranchId){
    alert("لا يمكنك تأكيد خروج تحويل من فرع آخر");
    return;
  }

  const product=db.products.find(p=>p.id===transfer.productId);

  if(!product){
    alert("المنتج غير موجود");
    return;
  }

  const available=getProductQuantity(product,transfer.fromBranchId);

  const reserved=db.transfers
    .filter(t=>
      t.id!==transfer.id&&
      t.fromBranchId===transfer.fromBranchId&&
      t.productId===transfer.productId&&
      t.status==="pending"
    )
    .reduce((sum,t)=>sum+Number(t.qty),0);

  if(available-reserved<transfer.qty){
    alert("الرصيد المتاح لا يكفي لإتمام التحويل");
    return;
  }

  if(!confirmAction("تأكيد خروج الكمية من الفرع المرسل؟")) return;

  product.stock=product.stock||{};

  product.stock[transfer.fromBranchId]=
    available-transfer.qty;

  transfer.status="shipped";
  transfer.shippedAt=nowText();
  transfer.shippedBy=currentUser.username;

  saveDatabase();

  logActivity(
    "تأكيد خروج تحويل",
    transfer.transferNo+" - "+transfer.productName
  );

  showPage("transfers");
}

/* تأكيد استلام المنتجات */
function receiveTransfer(id){
  if(!canCreateTransfer()) return;

  const transfer=db.transfers.find(t=>t.id===id);

  if(!transfer||transfer.status!=="shipped") return;

  if(!isGeneral()&&
    currentUser.branchId!==transfer.toBranchId){
    alert("لا يمكنك تأكيد استلام تحويل لفرع آخر");
    return;
  }

  const product=db.products.find(p=>p.id===transfer.productId);

  if(!product){
    alert("المنتج غير موجود");
    return;
  }

  if(!confirmAction("تأكيد استلام الكمية كاملة في الفرع المستلم؟")) return;

  product.stock=product.stock||{};

  product.stock[transfer.toBranchId]=
    Number(product.stock[transfer.toBranchId]||0)+
    Number(transfer.qty);

  transfer.status="received";
  transfer.receivedAt=nowText();
  transfer.receivedBy=currentUser.username;

  saveDatabase();

  logActivity(
    "تأكيد استلام تحويل",
    transfer.transferNo+" - "+transfer.productName
  );

  showPage("transfers");
}

/* إلغاء طلب تحويل قبل خروجه */
function cancelTransfer(id){
  if(!isGeneral()) return;

  const transfer=db.transfers.find(t=>t.id===id);

  if(!transfer||transfer.status!=="pending") return;

  if(!confirmAction("هل تريد إلغاء طلب التحويل؟")) return;

  transfer.status="cancelled";
  transfer.cancelledAt=nowText();
  transfer.cancelledBy=currentUser.username;

  saveDatabase();

  logActivity(
    "إلغاء طلب تحويل",
    transfer.transferNo
  );

  showPage("transfers");
}

/* إضافة منتج إلى السلة */
function addToCart(){
  if(!isCashier()) return;

  const productId=document.getElementById("cartProduct").value;
  const qty=Number(document.getElementById("cartQty").value);

  if(!productId){
    alert("اختر المنتج");
    return;
  }

  if(!Number.isInteger(qty)||qty<=0){
    alert("اكتب كمية صحيحة");
    return;
  }

  const product=db.products.find(p=>
    p.id===productId&&p.active
  );

  if(!product){
    alert("المنتج غير متاح");
    return;
  }

  const branchId=currentUser.branchId;
  const available=getProductQuantity(product,branchId);

  const existing=currentCart.find(i=>i.productId===productId);
  const currentQty=existing?existing.qty:0;

  if(currentQty+qty>available){
    alert("الكمية المطلوبة أكبر من المخزون المتاح");
    return;
  }

  if(existing){
    existing.qty+=qty;
  }else{
    currentCart.push({
      productId:product.id,
      name:product.name,
      qty,
      price:getProductPrice(product,branchId),
      cost:Number(product.cost||0)
    });
  }

  renderCart();
}

/* حساب إجمالي السلة */
function calculateCart(){
  const subtotal=currentCart.reduce((sum,item)=>
    sum+(item.qty*item.price),0
  );

  const vat=subtotal*(Number(db.settings.vatRate||0)/100);

  const fee=currentOrderType==="delivery"
    ?Number(document.getElementById("deliveryFee")?.value||0)
    :0;

  return {
    subtotal,
    vat,
    fee,
    total:subtotal+vat+fee
  };
}

/* حذف منتج من السلة */
function removeCartItem(index){
  if(!isCashier()) return;

  currentCart.splice(index,1);
  renderCart();
}

/* حفظ الأوردر */
function saveNewOrder(){
  if(!isCashier()) return;

  if(!currentCart.length){
    alert("أضف منتجات إلى السلة أولًا");
    return;
  }

  const customer=document.getElementById("orderCustomer").value.trim();
  const phone=document.getElementById("orderPhone").value.trim();
  const address=document.getElementById("orderAddress")?.value.trim()||"";
  const notes=document.getElementById("orderNotes").value.trim();
  const fee=currentOrderType==="delivery"
    ?Number(document.getElementById("deliveryFee").value||0)
    :0;

  if(!Number.isFinite(fee)||fee<0){
    alert("رسوم التوصيل غير صحيحة");
    return;
  }

  if(currentOrderType==="delivery"&&!address){
    alert("اكتب عنوان التوصيل");
    return;
  }

  const branchId=currentUser.branchId;

  for(const item of currentCart){
    const product=db.products.find(p=>p.id===item.productId);
    const available=getProductQuantity(product,branchId);

    if(!product||available<item.qty){
      alert("المخزون غير كافٍ للمنتج: "+item.name);
      return;
    }
  }

  const totals=calculateCart();

  const order={
    id:makeId("order"),
    invoiceNo:"GFT-"+String(db.settings.nextInvoice++).padStart(6,"0"),
    date:nowText(),
    day:today(),
    timestamp:Date.now(),
    branchId,
    type:currentOrderType,
    customer:customer||"عميل نقدي",
    phone,
    address,
    notes,
    items:currentCart.map(item=>({...item})),
    subtotal:totals.subtotal,
    vat:totals.vat,
    vatRate:Number(db.settings.vatRate||0),
    fee:totals.fee,
    total:totals.total,
    profit:0,
    payment:null,
    cashier:currentUser.name,
    cashierUser:currentUser.username,
    status:"pending",
    createdBy:currentUser.id
  };

  db.orders.push(order);

  saveDatabase();

  logActivity("إنشاء أوردر",order.invoiceNo);

  currentCart=[];

  alert("تم حفظ الأوردر بنجاح. يمكنك إتمام البيع من قائمة الأوردرات.");
  showPage("orders");
}

/* التحقق من صلاحية الوصول للأوردر */
function canAccessOrder(order){
  if(!order||!currentUser) return false;

  if(isGeneral()) return true;

  return order.branchId===currentUser.branchId;
}

/* إتمام البيع */
function completeOrder(orderId){
  if(!isCashier()&&!isGeneral()&&!isBranchManager()) return;

  const order=db.orders.find(o=>o.id===orderId);

  if(!canAccessOrder(order)){
    alert("غير مسموح لك بالوصول لهذا الأوردر");
    return;
  }

  if(order.status!=="pending"&&order.status!=="paused"){
    alert("الأوردر غير متاح للإتمام");
    return;
  }

  for(const item of order.items){
    const product=db.products.find(p=>p.id===item.productId);
    const available=getProductQuantity(product,order.branchId);

    if(!product||available<item.qty){
      alert("المخزون غير كافٍ للمنتج: "+item.name);
      return;
    }
  }

  const payment=prompt(
    "اختر طريقة الدفع:\n1 - كاش\n2 - بطاقة\n3 - تحويل",
    "1"
  );

  if(payment===null) return;

  const paymentNames={
    "1":"كاش",
    "2":"بطاقة",
    "3":"تحويل"
  };

  if(!paymentNames[payment]){
    alert("طريقة الدفع غير صحيحة");
    return;
  }

  if(!confirmAction(
    "تأكيد إتمام الفاتورة رقم "+order.invoiceNo+
    "\nالإجمالي: "+money(order.total)+
    "\nطريقة الدفع: "+paymentNames[payment]
  )) return;

  /* خصم الكمية من المخزون */
  order.items.forEach(item=>{
    const product=db.products.find(p=>p.id===item.productId);
    product.stock[order.branchId]=
      Number(product.stock[order.branchId]||0)-item.qty;
  });

  order.payment=paymentNames[payment];
  order.status="completed";
  order.completedAt=nowText();
  order.completedTimestamp=Date.now();

  order.profit=order.items.reduce((sum,item)=>
    sum+(item.price-item.cost)*item.qty,0
  );

  saveDatabase();

  logActivity("إتمام فاتورة",order.invoiceNo);

  alert("تم إتمام البيع وحفظ الفاتورة");

  if(isCashier()){
    showPage("orders");
  }else{
    showPage("orders");
  }
}

function isArchivedOrder(order){
  const orderDay = order.day || (order.date ? order.date.slice(0,10) : "");
  return orderDay !== today();
}

function getVisibleSales(){
  return db.orders.filter(order=>{

function renderSales(container){

function filterSales(){
  const results = document.getElementById("salesResults");
  if(!results) return;

  const invoice = (document.getElementById("salesInvoice")?.value || "").trim().toLowerCase();
  const customer = (document.getElementById("salesCustomer")?.value || "").trim().toLowerCase();
  const from = document.getElementById("salesFrom")?.value || "";
  const to = document.getElementById("salesTo")?.value || "";

  let sales = getVisibleSales();

  sales = sales.filter(order=>{
    const invoiceMatch = String(order.invoiceNo || "").toLowerCase().includes(invoice);
    const customerMatch = String(order.customer || "").toLowerCase().includes(customer);
    const orderDay = order.day || (order.date ? order.date.slice(0,10) : "");

    const fromMatch = !from || orderDay >= from;
    const toMatch = !to || orderDay <= to;

    return invoiceMatch && customerMatch && fromMatch && toMatch;
  });

  sales.sort((a,b)=>(b.timestamp || 0)-(a.timestamp || 0));

  if(!sales.length){
    results.innerHTML = "<p>لا توجد فواتير مطابقة لبحثك.</p>";
    return;
  }

  results.innerHTML = `
    <div class="table-wrap">
      <table>

            <th>التاريخ</th>

            <th>العميل</th>
            <th>الكاشير</th>
            <th>الدفع</th>
            <th>الإجمالي</th>
            <th>الربح</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody>
          ${sales.map(order=>`
            <tr>
              <td>${escapeHTML(order.invoiceNo)}</td>
              <td>${escapeHTML(order.date || "")}</td>
              <td>${escapeHTML(branchName(order.branchId))}</td>
              <td>${escapeHTML(order.customer || "عميل نقدي")}</td>
              <td>${escapeHTML(order.cashier || "")}</td>
              <td>${escapeHTML(order.payment || "")}</td>
              <td>${money(order.total)}</td>
              <td>${money(order.profit)}</td>
              <td>
                <button onclick="viewOrder('${order.id}')">عرض</button>
                <button class="secondary" onclick="printOrder('${order.id}')">طباعة</button>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>

    <p>عدد الفواتير: ${sales.length}</p>
    <p>إجمالي المبيعات: ${money(sales.reduce((sum,o)=>sum+Number(o.total || 0),0))}</p>
  `;
}

function resetSalesFilters(){
  ["salesInvoice","salesCustomer","salesFrom","salesTo"].forEach(id=>{
    const field = document.getElementById(id);
    if(field) field.value = "";
  });

  filterSales();
}

  const names={
    pending:"في انتظار الموافقة",
    approved:"تمت الموافقة",
    rejected:"مرفوض"
  };
  return names[status] || status;
}

            </tr>
          </thead>
          <tbody>

                  ` : "-"}

  `;
}

function createDiscountRequest(orderId){
  const order=db.orders.find(o=>o.id===orderId);

  if(!order || !canAccessOrder(order)){
    showMessage("لا يمكن الوصول إلى الفاتورة");
    return;
  }

  const amount=Number(prompt("اكتب قيمة الخصم المطلوبة:"));

  if(!Number.isFinite(amount) || amount<=0 || amount>=Number(order.total)){
    showMessage("قيمة الخصم غير صحيحة");
    return;
  }

  const reason=prompt("اكتب سبب طلب الخصم:");

  if(!reason || !reason.trim()){
    showMessage("يجب كتابة سبب الخصم");
    return;
  }

  db.requests.push({
    id:makeId(),
    type:"discount",
    orderId:order.id,
    invoiceNo:order.invoiceNo,
    branchId:order.branchId,
    amount,
    reason:reason.trim(),
    requestedBy:currentUser.name,
    requestedByUser:currentUser.id,
    status:"pending",
    createdAt:nowText(),
    decidedBy:"",
    decidedAt:""
  });

  saveDatabase();
  logActivity("طلب خصم",`فاتورة ${order.invoiceNo} - ${amount}`);

  showMessage("تم إرسال طلب الخصم للمدير العام");
}

function createCancelRequest(orderId){
  const order=db.orders.find(o=>o.id===orderId);

  if(!order || !canAccessOrder(order)){
    showMessage("لا يمكن الوصول إلى الفاتورة");
    return;
  }

  if(order.status==="cancelled"){
    showMessage("الفاتورة ملغاة بالفعل");
    return;
  }

  const reason=prompt("اكتب سبب طلب إلغاء الفاتورة:");

  if(!reason || !reason.trim()){
    showMessage("يجب كتابة سبب الإلغاء");
    return;
  }

  db.requests.push({
    id:makeId(),
    type:"cancel",
    orderId:order.id,
    invoiceNo:order.invoiceNo,
    branchId:order.branchId,
    reason:reason.trim(),
    requestedBy:currentUser.name,
    requestedByUser:currentUser.id,
    status:"pending",
    createdAt:nowText(),
    decidedBy:"",
    decidedAt:""
  });

  saveDatabase();
  logActivity("طلب إلغاء فاتورة",`فاتورة ${order.invoiceNo}`);

  showMessage("تم إرسال طلب الإلغاء للمدير العام");
}

function decideRequest(requestId,decision){
  if(!isGeneral()){
    showMessage("المدير العام فقط يستطيع اتخاذ القرار");
    return;
  }

  const request=db.requests.find(r=>r.id===requestId);

  if(!request || request.status!=="pending"){
    showMessage("هذا الطلب غير متاح");
    return;
  }

  if(decision!=="approved" && decision!=="rejected") return;

  const order=db.orders.find(o=>o.id===request.orderId);

  if(!order){
    showMessage("الفاتورة غير موجودة");
    return;
  }

  if(decision==="approved"){
    if(request.type==="discount"){
      if(order.status!=="completed"){
        showMessage("لا يمكن تطبيق الخصم على فاتورة غير مكتملة");
        return;
      }

      if(Number(request.amount)<=0 || Number(request.amount)>=Number(order.total)){
        showMessage("قيمة الخصم غير صالحة");
        return;
      }

      order.discount=Number(order.discount || 0)+Number(request.amount);
      order.total=Number(order.total)-Number(request.amount);

      logActivity("اعتماد خصم",`فاتورة ${order.invoiceNo}`);
    }

    if(request.type==="cancel"){
      if(order.status!=="completed"){
        showMessage("لا يمكن إلغاء فاتورة غير مكتملة بهذه الطريقة");
        return;
      }

      order.status="cancelled";

      order.items.forEach(item=>{
        const product=db.products.find(p=>p.id===item.productId);

        if(product){
          product.stock=product.stock || {};
          product.stock[order.branchId]=
            Number(product.stock[order.branchId] || 0)+Number(item.quantity);
        }
      });

      logActivity("اعتماد إلغاء فاتورة",`فاتورة ${order.invoiceNo}`);
    }
  }

  request.status=decision;
  request.decidedBy=currentUser.name;
  request.decidedAt=nowText();

  saveDatabase();

  showMessage(decision==="approved"?"تمت الموافقة على الطلب":"تم رفض الطلب");

  renderRequests(document.getElementById("pageContent"));
}

/* حسابات وخزائن الفروع */

function getBranchAccount(branchId){
  const completed=db.orders.filter(o=>
    o.branchId===branchId && o.status==="completed"
  );

  const cancelled=db.orders.filter(o=>
    o.branchId===branchId && o.status==="cancelled"
  );

  const expenses=db.expenses.filter(e=>e.branchId===branchId);

  const sales=completed.reduce((s,o)=>s+Number(o.total||0),0);
  const expenseTotal=expenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const cancelledTotal=cancelled.reduce((s,o)=>s+Number(o.total||0),0);

  return {
    sales,
    expenses:expenseTotal,
    cancelled:cancelledTotal,
    net:sales-expenseTotal
  };
}

function renderAccounts(container){
  if(!isGeneral()){
    container.innerHTML="<p>هذه الشاشة متاحة للمدير العام فقط.</p>";
    return;

  const accounts=branches.map(b=>({
    branch:b,
    account:getBranchAccount(b.id)
  }));

  const totalSales=accounts.reduce((s,a)=>s+a.account.sales,0);
  const totalExpenses=accounts.reduce((s,a)=>s+a.account.expenses,0);
  const totalNet=totalSales-totalExpenses;

  container.innerHTML=`
    <div class="panel">
      <h2>الحسابات العامة والخزائن</h2>

      <div class="stats-grid">
        <div class="stat-card">
          <h3>إجمالي المبيعات</h3>

function openShift(){
  if(!currentUser || !currentUser.branchId){
    showMessage("يجب ربط المستخدم بفرع أولاً");
    return;
  }

  const existing=db.shifts.find(s=>
    s.userId===currentUser.id && s.status==="open"
  );

  if(existing){
    showMessage("لديك وردية مفتوحة بالفعل");
    return;
  }

  const openingCash=Number(document.getElementById("shiftOpening").value);

  if(!Number.isFinite(openingCash) || openingCash<0){
    showMessage("قيمة العهدة غير صحيحة");
    return;
  }

  const shift={
    id:makeId(),
    userId:currentUser.id,
    userName:currentUser.name,
    branchId:currentUser.branchId,
    startTime:nowText(),
    startTimestamp:Date.now(),
    endTime:"",
    openingCash,
    expectedCash:openingCash,
    actualCash:null,
    difference:null,
    note:"",
    status:"open"
  };

  db.shifts.push(shift);

  saveDatabase();
  logActivity("بدء وردية",`عهدة ${money(openingCash)}`);

  showMessage("تم بدء الوردية بنجاح");
  renderShifts(document.getElementById("pageContent"));
}

function calculateShiftExpectedCash(shift){
  const shiftOrders=db.orders.filter(o=>
    o.branchId===shift.branchId &&
    o.cashierUser===shift.userId &&
    o.status==="completed" &&
    Number(o.completedTimestamp || 0)>=shift.startTimestamp &&
    Number(o.completedTimestamp || 0)<=Date.now()
  );

  const cashSales=shiftOrders
    .filter(o=>o.payment==="cash")
    .reduce((sum,o)=>sum+Number(o.total||0),0);

  return Number(shift.openingCash||0)+cashSales;
}

function closeShift(){
  const shift=db.shifts.find(s=>
    s.userId===currentUser.id && s.status==="open"
  );

  if(!shift){
    showMessage("لا توجد وردية مفتوحة");
    return;
  }

  const actualCash=Number(document.getElementById("shiftActualCash").value);
  const note=document.getElementById("shiftClosingNote").value.trim();

  if(!Number.isFinite(actualCash) || actualCash<0){
    showMessage("أدخل النقدية الفعلية بشكل صحيح");
    return;
  }

  const expectedCash=calculateShiftExpectedCash(shift);

  shift.expectedCash=expectedCash;
  shift.actualCash=actualCash;
  shift.difference=actualCash-expectedCash;
  shift.endTime=nowText();
  shift.endTimestamp=Date.now();
  shift.note=note;
  shift.status="closed";

  saveDatabase();

  logActivity(
    "إغلاق وردية",
    `الفرق ${money(shift.difference)}`
  );

  showMessage(
    shift.difference===0
      ? "تم إغلاق الوردية بدون عجز أو زيادة"
      : shift.difference>0
        ? "تم إغلاق الوردية ويوجد زيادة"
        : "تم إغلاق الوردية ويوجد عجز"
  );

  renderShifts(document.getElementById("pageContent"));
}

      <button class="secondary" onclick="resetReports()">كل الفترات</button>

      <div id="reportResults"></div>
    </div>
  `;

  filterReports();
}

function filterReports(){
  const results=document.getElementById("reportResults");
  if(!results) return;

  const from=document.getElementById("reportFrom")?.value || "";
  const to=document.getElementById("reportTo")?.value || "";

  const orders=getReportOrders().filter(o=>{
    const date=String(o.day || o.date || "").slice(0,10);
    return (!from || date>=from) && (!to || date<=to);
  });

  const sales=orders.reduce((s,o)=>s+Number(o.total||0),0);
  const profit=orders.reduce((s,o)=>s+Number(o.profit||0),0);

  const expenses=db.expenses.filter(e=>{
    const date=String(e.date || "").slice(0,10);

    return (!from || date>=from) &&
      (!to || date<=to) &&
      (isGeneral() || e.branchId===currentUser.branchId);
  });

  const expenseTotal=expenses.reduce((s,e)=>s+Number(e.amount||0),0);

  const branchGroups={};
  const cashierGroups={};

  orders.forEach(o=>{
    const branch=branchName(o.branchId);
    const cashier=o.cashier || "غير محدد";

    if(!branchGroups[branch]){
      branchGroups[branch]={sales:0,count:0,profit:0};
    }

    branchGroups[branch].sales+=Number(o.total||0);
    branchGroups[branch].count++;
    branchGroups[branch].profit+=Number(o.profit||0);

    if(!cashierGroups[cashier]){
      cashierGroups[cashier]={sales:0,count:0};
    }

    cashierGroups[cashier].sales+=Number(o.total||0);
    cashierGroups[cashier].count++;
  });

  const bestBranch=Object.entries(branchGroups)
    .sort((a,b)=>b[1].sales-a[1].sales)[0];

  const bestCashier=Object.entries(cashierGroups)
    .sort((a,b)=>b[1].sales-a[1].sales)[0];

  results.innerHTML=`
    <div class="stats-grid">
      <div class="stat-card">
        <h3>إجمالي المبيعات</h3>
        <strong>${money(sales)}</strong>
      </div>

      <div class="stat-card">
        <h3>عدد الفواتير</h3>
        <strong>${orders.length}</strong>
      </div>

      <div class="stat-card">
        <h3>إجمالي الأرباح المسجلة</h3>
        <strong>${money(profit)}</strong>
      </div>

      <div class="stat-card">
        <h3>المصروفات</h3>
        <strong>${money(expenseTotal)}</strong>
      </div>

      <div class="stat-card">
        <h3>صافي بعد المصروفات</h3>
        <strong>${money(profit-expenseTotal)}</strong>
      </div>
    </div>

    <h3>أفضل فرع</h3>
    <p>${bestBranch
      ? escapeHTML(bestBranch[0])+" - "+money(bestBranch[1].sales)
      : "لا توجد بيانات"}</p>

    <h3>أفضل كاشير</h3>
    <p>${bestCashier
      ? escapeHTML(bestCashier[0])+" - "+money(bestCashier[1].sales)
      : "لا توجد بيانات"}</p>

    <h3>مقارنة الفروع</h3>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>الفرع</th>
            <th>عدد الفواتير</th>
            <th>المبيعات</th>
            <th>الأرباح المسجلة</th>
          </tr>
        </thead>

        <tbody>
          ${Object.entries(branchGroups).map(([name,data])=>`
            <tr>
              <td>${escapeHTML(name)}</td>
              <td>${data.count}</td>
              <td>${money(data.sales)}</td>
              <td>${money(data.profit)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>

    <h3>أداء الكاشير</h3>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>الكاشير</th>
            <th>عدد الفواتير</th>
            <th>إجمالي المبيعات</th>
          </tr>
        </thead>

        <tbody>
          ${Object.entries(cashierGroups).map(([name,data])=>`
            <tr>
              <td>${escapeHTML(name)}</td>
              <td>${data.count}</td>
              <td>${money(data.sales)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

  const to=document.getElementById("reportTo");

function renderForecast(container){
  if(!isGeneral()){
    container.innerHTML="<p>التوقعات الذكية متاحة للمدير العام فقط.</p>";
    return;
  }

  const completed=db.orders.filter(o=>
    o.status==="completed"
  );

  const last30=completed.filter(o=>
    Number(o.timestamp||0)>=Date.now()-30*24*60*60*1000
  );

  const last7=completed.filter(o=>
    Number(o.timestamp||0)>=Date.now()-7*24*60*60*1000
  );

  const sales30=last30.reduce((s,o)=>s+Number(o.total||0),0);
  const sales7=last7.reduce((s,o)=>s+Number(o.total||0),0);

  const dailyAverage=sales30/30;
  const weeklyAverage=sales7/7;

  const enoughData=last30.length>=10;

  const next7Days=dailyAverage*7;
  const next30Days=dailyAverage*30;

  const productStats={};

  last30.forEach(order=>{
    (order.items||[]).forEach(item=>{
      const id=item.productId;

      if(!productStats[id]){
        productStats[id]={
          name:item.name,
          quantity:0
        };
      }

      productStats[id].quantity+=Number(item.quantity||0);
    });
  });

  const bestProducts=Object.values(productStats)
    .sort((a,b)=>b.quantity-a.quantity)
    .slice(0,5);

  const stockAlerts=[];

  db.products.filter(p=>p.active!==false).forEach(product=>{
    db.branches.filter(b=>b.active).forEach(branch=>{
      const quantity=getProductQuantity(product.id,branch.id);

      if(quantity<=5){
        stockAlerts.push({
          product:product.name,
          branch:branch.name,
          quantity
        });
      }
    });
  });

  container.innerHTML=`
    <div class="panel">
      <h2>التوقعات الذكية</h2>

      <p>تحليل مبني على بيانات المبيعات المسجلة خلال آخر 30 يومًا.</p>

      ${!enoughData ? `
        <div class="notice">
          البيانات الحالية غير كافية لتوقعات موثوقة.
          نحتاج إلى تسجيل 10 فواتير مكتملة على الأقل خلال آخر 30 يومًا.
        </div>
      ` : ""}

      <div class="stats-grid">
        <div class="stat-card">
          <h3>متوسط المبيعات اليومي</h3>
          <strong>${money(dailyAverage)}</strong>
        </div>

        <div class="stat-card">
          <h3>متوسط آخر 7 أيام يوميًا</h3>
          <strong>${money(weeklyAverage)}</strong>
        </div>

        <div class="stat-card">
          <h3>توقع 7 أيام</h3>
          <strong>${money(next7Days)}</strong>
        </div>

        <div class="stat-card">
          <h3>توقع 30 يومًا</h3>
          <strong>${money(next30Days)}</strong>
        </div>
      </div>

      <h3>أكثر المنتجات مبيعًا</h3>

      ${bestProducts.length ? `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>المنتج</th>
                <th>الكمية المباعة</th>
              </tr>
            </thead>
            <tbody>
              ${bestProducts.map(p=>`
                <tr>
                  <td>${escapeHTML(p.name)}</td>
                  <td>${p.quantity}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      ` : "<p>لا توجد مبيعات كافية للمنتجات.</p>"}

      <h3>تنبيهات المخزون</h3>

      ${stockAlerts.length ? `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>المنتج</th>
                <th>الفرع</th>
                <th>المخزون الحالي</th>
              </tr>
            </thead>
            <tbody>
              ${stockAlerts.map(p=>`
                <tr>
                  <td>${escapeHTML(p.product)}</td>
                  <td>${escapeHTML(p.branch)}</td>
                  <td>${p.quantity}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      ` : "<p>لا توجد منتجات وصلت إلى حد التنبيه.</p>"}

      <p class="muted">
        التوقعات تقديرية وتعتمد على متوسط المبيعات السابق،
        ولا تمثل ضمانًا للمبيعات المستقبلية.
      </p>
    </div>
  `;
}

function createBackup(){
  if(!isGeneral()) return;

  const backup={
    app:"GIFTORA POS",
    version:1,
    createdAt:nowText(),
    data:JSON.parse(JSON.stringify(db))
  };

  db.backups=db.backups||[];

  db.backups.push({
    id:makeId(),
    createdAt:backup.createdAt,
    data:backup.data
  });

  saveDatabase();

  logActivity("إنشاء نسخة احتياطية","تم إنشاء نسخة يدوية");

  downloadJSON(
    backup,
    "GIFTORA_BACKUP_"+today()+".json"
  );

  showMessage("تم إنشاء النسخة الاحتياطية وتنزيلها");
  renderBackupList();
}

function downloadBackup(){
  if(!isGeneral()) return;

  };

  saveDatabase();

  showMessage("تم تجهيز ملف النسخة الاحتياطية");
}

function downloadJSON(data,fileName){
  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json;charset=utf-8"}
  );

  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");

  link.href=url;
  link.download=fileName;
  document.body.appendChild(link);
  link.click();
  link.remove();

  URL.revokeObjectURL(url);
}

function renderBackupList(){
  const list=document.getElementById("backupList");

  const backups=db.backups||[];

function restoreLocalBackup(backupId){
  if(!isGeneral()) return;

  const backup=(db.backups||[]).find(b=>b.id===backupId);

  if(!backup || !backup.data){
    showMessage("النسخة غير صالحة");
    return;
  }

  if(!confirm("سيتم استبدال البيانات الحالية ببيانات النسخة المحددة. هل تريد المتابعة؟")){
    return;
  }

  const restored=JSON.parse(JSON.stringify(backup.data));

  if(!restored.users || !restored.settings){
    showMessage("النسخة غير مكتملة");
    return;
  }

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(restored)
  );

  showMessage("تم استرجاع النسخة. سيتم إعادة تحميل النظام.");

  location.reload();
}

function restoreBackup(){
  if(!isGeneral()) return;

  const input=document.getElementById("backupFile");
  const file=input?.files?.[0];

  if(!file){
    showMessage("اختر ملف النسخة الاحتياطية أولاً");
    return;
  }

  const reader=new FileReader();

  reader.onload=function(event){
    try{
      const backup=JSON.parse(event.target.result);
      const restored=backup.data;

      if(
        backup.app!=="GIFTORA POS" ||
        !restored ||
        !Array.isArray(restored.users) ||
        !restored.settings
      ){
        showMessage("ملف النسخة الاحتياطية غير صالح");
        return;
      }

      if(!confirm("سيتم استبدال جميع البيانات الحالية. هل تريد المتابعة؟")){
        return;
      }

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(restored)
      );

      showMessage("تم استرجاع البيانات بنجاح");

      location.reload();

    }catch(error){
      showMessage("تعذر قراءة ملف النسخة الاحتياطية");
    }
  };

  reader.onerror=function(){
    showMessage("حدث خطأ أثناء قراءة الملف");
  };

  reader.readAsText(file);
}

function getCompletedOrders(branchId=null){
  return db.orders.filter(o=>
    o.status==="completed" &&
    (!branchId || o.branchId===branchId)
  );
}

function getPendingOrders(branchId=null){
  return db.orders.filter(o=>
    o.status==="pending" &&
    (!branchId || o.branchId===branchId)
  );
}

function getStockValue(branchId=null){
  let total=0;

  db.products.filter(p=>p.active!==false).forEach(product=>{
    db.branches.filter(b=>
      b.active && (!branchId || b.id===branchId)
    ).forEach(branch=>{
      const quantity=getProductQuantity(product.id,branch.id);
      const price=getProductPrice(product,branch.id);

      total+=Number(quantity||0)*Number(price||0);
    });
  });

  return total;
}

/* 2- تصحيح إنشاء التحويل */

function createTransfer(){
  if(!canCreateTransfer()) return;

  const fromBranchId=document.getElementById("transferFrom").value;
  const toBranchId=document.getElementById("transferTo").value;
  const productId=document.getElementById("transferProduct").value;
  const quantity=Number(document.getElementById("transferQuantity").value);

  if(!fromBranchId || !toBranchId || fromBranchId===toBranchId){
    showMessage("اختر فرعين مختلفين");
    return;
  }

  if(isBranchManager() &&
    fromBranchId!==currentUser.branchId &&
    toBranchId!==currentUser.branchId){
    showMessage("يجب أن يكون أحد الفرعين هو فرعك");
    return;
  }

  if(!Number.isInteger(quantity) || quantity<=0){
    showMessage("الكمية غير صحيحة");
    return;
  }

  const product=db.products.find(p=>p.id===productId);

  if(!product || product.active===false){
    showMessage("المنتج غير متاح");
    return;
  }

  const available=getProductQuantity(productId,fromBranchId);

  const reserved=db.transfers
    .filter(t=>
      t.fromBranchId===fromBranchId &&
      t.productId===productId &&
      t.status==="pending"
    )
    .reduce((s,t)=>s+Number(t.quantity||0),0);

  if(available-reserved<quantity){
    showMessage("المخزون غير كافٍ للتحويل");
    return;
  }

  db.transfers.push({
    id:makeId(),
    fromBranchId,
    toBranchId,
    productId,
    quantity,
    status:"pending",
    createdBy:currentUser.name,
    createdByUser:currentUser.id,
    createdAt:nowText()
  });

  saveDatabase();
  logActivity("إنشاء تحويل منتجات",`${quantity} من ${branchName(fromBranchId)} إلى ${branchName(toBranchId)}`);

  showMessage("تم إنشاء طلب التحويل");
  renderTransfers(document.getElementById("pageContent"));
}

/* 2- تعديل سعر منتج */

function changeGlobalPrice(productId){
  if(!isGeneral()) return;

  const product=db.products.find(p=>p.id===productId);
  if(!product) return;

  const value=prompt("أدخل السعر الموحد الجديد:",product.price);

  if(value===null) return;

  const newPrice=Number(value);

  if(!Number.isFinite(newPrice) || newPrice<0){
    showMessage("السعر غير صحيح");
    return;
  }

  const oldPrice=Number(product.price||0);

  product.price=newPrice;

  db.priceHistory=db.priceHistory||[];

  db.priceHistory.push({
    id:makeId(),
    productId,
    oldPrice,
    newPrice,
    branchId:null,
    changedBy:currentUser.name,
    changedAt:nowText(),
    type:"global"
  });

  saveDatabase();
  logActivity("تغيير السعر الموحد",product.name);

  showMessage("تم تعديل السعر الموحد");

function setBranchPrice(productId,branchId){

  const oldPrice=getProductPrice(product,branchId);

  const value=prompt("أدخل سعر الفرع الجديد:",oldPrice);

  const newPrice=Number(value);

  if(!Number.isFinite(newPrice) || newPrice<0){
    showMessage("السعر غير صحيح");
    return;
  }

  product.branchPrices=product.branchPrices||{};

  product.branchPrices[branchId]=newPrice;

  db.priceHistory=db.priceHistory||[];

  db.priceHistory.push({
    id:makeId(),
    productId,
    branchId,
    oldPrice,
    newPrice,
    changedBy:currentUser.name,
    changedAt:nowText(),
    type:"branch"
  });

  saveDatabase();

  logActivity("تعديل سعر فرع",product.name);

/* منع تكرار طلب الخصم لنفس الفاتورة */
function createDiscountRequest(orderId){
  const order=db.orders.find(o=>o.id===orderId);

  if(!order){
    showMessage("الفاتورة غير موجودة");
    return;
  }

  if(order.status!=="completed"){
    showMessage("لا يمكن طلب خصم على فاتورة غير مكتملة");
    return;
  }

  const existing=(db.requests||[]).find(r=>
    r.orderId===orderId &&
    r.type==="discount" &&
    r.status==="pending"
  );

  if(existing){
    showMessage("يوجد طلب خصم قيد المراجعة بالفعل");
    return;
  }

  const amount=Number(prompt("أدخل قيمة الخصم المطلوبة:"));

  if(!Number.isFinite(amount) || amount<=0 || amount>=Number(order.total)){
    showMessage("قيمة الخصم غير صحيحة");
    return;
  }

  const reason=prompt("اكتب سبب طلب الخصم:");

  if(!reason || !reason.trim()){
    showMessage("يجب كتابة سبب الخصم");
    return;
  }

  db.requests=db.requests||[];

  db.requests.push({
    id:makeId(),
    orderId,
    type:"discount",
    amount,
    reason:reason.trim(),
    status:"pending",
    requestedBy:currentUser.name,
    requestedById:currentUser.id,
    requestedAt:nowText()
  });

  saveDatabase();
  logActivity("طلب خصم",order.invoiceNo);

  showMessage("تم إرسال طلب الخصم للمدير العام");
}

}

/* مراجعة موافقات المدير العام */
function decideRequest(requestId,decision){
  if(!isGeneral()){
    showMessage("المدير العام فقط يستطيع اتخاذ القرار");
    return;
  }

  const request=(db.requests||[]).find(r=>r.id===requestId);

  if(!request || request.status!=="pending"){
    showMessage("الطلب غير موجود أو تمت مراجعته سابقاً");
    return;
  }

  const order=db.orders.find(o=>o.id===request.orderId);

  if(!order){
    showMessage("الفاتورة غير موجودة");
    return;
  }

  if(decision==="approve"){
    if(request.type==="discount"){
      if(order.status!=="completed"){
        showMessage("الفاتورة لم تعد مكتملة");
        return;
      }

      const discount=Number(request.amount);

      if(!Number.isFinite(discount) || discount<=0 || discount>=Number(order.total)){
        showMessage("قيمة الخصم غير صالحة");
        return;
      }

      order.discount=Number(order.discount||0)+discount;
      order.total=Math.max(0,Number(order.total)-discount);
    }

    if(request.type==="cancel"){
      if(order.status!=="completed"){
        showMessage("الفاتورة لم تعد مكتملة");
        return;
      }

      order.status="cancelled";
      order.cancelledAt=nowText();
      order.cancelledBy=currentUser.name;
      order.cancelReason=request.reason;

      (order.items||[]).forEach(item=>{
        const product=db.products.find(p=>p.id===item.productId);

        if(product){
          product.stock=product.stock||{};
          product.stock[order.branchId]=
            Number(product.stock[order.branchId]||0)+Number(item.quantity||0);
        }
      });
    }

    request.status="approved";
  }
  else if(decision==="reject"){
    request.status="rejected";
  }
  else{
    showMessage("قرار غير صحيح");
    return;
  }

  request.decidedBy=currentUser.name;
  request.decidedById=currentUser.id;
  request.decidedAt=nowText();

  saveDatabase();

  logActivity(
    decision==="approve"?"الموافقة على طلب":"رفض طلب",
    order.invoiceNo
  );

  showMessage("تم تسجيل القرار");
  showPage("requests");
}

/* حماية إضافية عند إتمام الفاتورة */
function completeOrder(orderId){
  const order=db.orders.find(o=>o.id===orderId);

  if(!order){
    showMessage("الفاتورة غير موجودة");

  }

  if(order.status==="completed" || order.status==="cancelled"){
    showMessage("تم إنهاء هذه الفاتورة بالفعل");
    return;
  }

  return originalCompleteOrder20(orderId);
}

/* 1- حساب مبيعات الفرع */

function getBranchSalesTotal(branchId,fromDate=null,toDate=null){
  return db.orders
    .filter(o=>
      o.branchId===branchId &&
      o.status==="completed" &&
      (!fromDate || o.day>=fromDate) &&
      (!toDate || o.day<=toDate)
    )
    .reduce((sum,o)=>sum+Number(o.total||0),0);
}

function getBranchExpensesTotal(branchId,fromDate=null,toDate=null){
  return (db.expenses||[])
    .filter(e=>
      e.branchId===branchId &&
      (!fromDate || e.date>=fromDate) &&
      (!toDate || e.date<=toDate)
    )
    .reduce((sum,e)=>sum+Number(e.amount||0),0);
}

function getBranchCashSales(branchId,fromDate=null,toDate=null){

  if(!isGeneral() && !isBranchManager()){
    showMessage("ليس لديك صلاحية إضافة مصروف");
    return;
  }

  const description=prompt("اكتب بيان المصروف:");

  if(!description || !description.trim()) return;

  const amount=Number(prompt("أدخل مبلغ المصروف:"));

  if(!Number.isFinite(amount) || amount<=0){
    showMessage("المبلغ غير صحيح");
    return;
  }

  let branchId;

  if(isGeneral()){
    const options=db.branches.filter(b=>b.active);

    if(options.length===0){
      showMessage("لا توجد فروع نشطة");
      return;
    }

    if(options.length===1){
      branchId=options[0].id;
    }else{
      const names=options.map((b,i)=>`${i+1}- ${b.name}`).join("\n");

        return;
      }

      branchId=options[selected-1].id;
    }
  }else{
    branchId=currentUser.branchId;
  }

  db.expenses=db.expenses||[];

  db.expenses.push({
    id:makeId(),
    branchId,
    description:description.trim(),
    amount,
    date:today(),
    createdBy:currentUser.name,
    createdById:currentUser.id,
    createdAt:nowText()
  });

  saveDatabase();

  logActivity("إضافة مصروف",description);

  showMessage("تم تسجيل المصروف بنجاح");

  if(currentPage==="expenses"){
    renderExpenses(document.getElementById("pageContent"));

}

/* 2- إجمالي قيمة المخزون */

function getTotalInventoryValue24(){
  let total=0;

  db.branches
    .filter(b=>b.active)
    .forEach(branch=>{
      db.products
        .filter(p=>p.active!==false)
        .forEach(product=>{
          const quantity=getProductQuantity(product.id,branch.id);
          const cost=Number(product.cost||0);

          total+=quantity*cost;
        });
    });

  return total;
}

/* 3- تنبيهات المخزون */

function getLowStockProducts24(){
  const result=[];

  db.branches
    .filter(b=>b.active)
    .forEach(branch=>{
      db.products
        .filter(p=>p.active!==false)
        .forEach(product=>{
          const quantity=getProductQuantity(product.id,branch.id);

          if(quantity<=5){
            result.push({
              branch:branch.name,
              product:product.name,
              quantity
            });
          }
        });
    });

  return result;
}

/* 4- ترتيب الفروع */

function getBranchPerformance24(){
  return db.branches
    .filter(b=>b.active)
    .map(branch=>{
      const orders=db.orders.filter(o=>
        o.branchId===branch.id &&
        o.status==="completed"
      );

      return {
        name:branch.name,
        count:orders.length,
        sales:orders.reduce((s,o)=>
          s+Number(o.total||0),0),
        profit:orders.reduce((s,o)=>
          s+Number(o.profit||0),0)
      };
    })
    .sort((a,b)=>b.sales-a.sales);
}

/* 5- حساب مؤشرات لوحة المدير العام */

function getGeneralDashboardData24(){
  const orders=db.orders.filter(o=>
    o.status==="completed"
  );

  const sales=orders.reduce((s,o)=>
    s+Number(o.total||0),0);

  const profit=orders.reduce((s,o)=>
    s+Number(o.profit||0),0);

  const expenses=(db.expenses||[]).reduce((s,e)=>
    s+Number(e.amount||0),0);

  const pending=db.orders.filter(o=>
    o.status==="pending" || o.status==="paused"
  ).length;

  return {
    orders:orders.length,
    sales,
    profit,
    expenses,
    net:profit-expenses,
    pending
  };
}

/* 7- حساب توقع المبيعات */

function getSalesForecast24(){
  const orders=db.orders.filter(o=>
    o.status==="completed"
  );

  const daily={};

  orders.forEach(o=>{
    const day=o.day||"";

    if(!day) return;

    daily[day]=(daily[day]||0)+Number(o.total||0);
  });

  const dates=Object.keys(daily).sort().slice(-30);

  if(dates.length<7){
    return {
      available:false,
      message:"نحتاج بيانات مبيعات لمدة 7 أيام على الأقل لعرض توقع مبدئي.",
      average:0,
      expected:0,
      days:dates.length
    };
  }

  const total=dates.reduce((s,d)=>s+daily[d],0);
  const average=total/dates.length;

  return {
    available:true,
    average,
    expected:average*30,
    days:dates.length
  };
}

/* 8- أفضل المنتجات */

function getTopProductsForecast24(){
  const products={};

  db.orders
    .filter(o=>o.status==="completed")
    .forEach(order=>{
      (order.items||[]).forEach(item=>{
        const id=item.productId||item.name;

        if(!products[id]){
          products[id]={
            name:item.name||"منتج",
            quantity:0
          };
        }

        products[id].quantity+=Number(item.quantity||0);
      });
    });

  return Object.values(products)
    .sort((a,b)=>b.quantity-a.quantity)
    .slice(0,10);
}

/* 1- صلاحية النسخ الاحتياطي */

function checkBackupPermission25(){
  if(!currentUser || !isGeneral()){
    showMessage("المدير العام فقط يستطيع إدارة النسخ الاحتياطية");
    return false;
  }
  return true;
}

/* 2- تجهيز نسخة آمنة من البيانات */

function getBackupSnapshot25(){
  const snapshot=JSON.parse(JSON.stringify(db));

  /* استبعاد النسخ القديمة لتجنب تضخم حجم النسخة */
  snapshot.backups=[];

  return snapshot;
}

/* 3- التحقق من سلامة بيانات النسخة */

function validateBackupData25(data){
  if(!data || typeof data!=="object") return false;

  const requiredArrays=[
    "users",
    "branches",
    "products",
    "orders",
    "transfers",
    "expenses",
    "shifts",
    "requests",
    "activity",
    "priceHistory"
  ];

  return requiredArrays.every(key=>
    Array.isArray(data[key])
  );
}

/* 4- تنزيل ملف JSON */

function downloadJSON(data,filename){
  if(!checkBackupPermission25()) return;

  const content=JSON.stringify(data,null,2);

  const blob=new Blob(
    [content],
    {type:"application/json;charset=utf-8"}
  );

  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");

  link.href=url;
  link.download=filename||"giftora-backup.json";

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* 5- إنشاء نسخة احتياطية */

function createBackup(){
  if(!checkBackupPermission25()) return;

  const snapshot=getBackupSnapshot25();

  const backup={
    id:makeId(),
    name:"نسخة احتياطية GIFTORA",
    date:today(),
    createdAt:nowText(),
    createdBy:currentUser.name,
    data:snapshot
  };

  db.backups=db.backups||[];
  db.backups.push(backup);

  saveDatabase();

  logActivity(
    "إنشاء نسخة احتياطية",
    backup.createdAt
  );

  downloadJSON(
    backup,
    "GIFTORA-Backup-"+today()+".json"
  );

  showMessage("تم إنشاء النسخة الاحتياطية وتنزيلها");

  const container=document.getElementById("pageContent");

  if(container && currentPage==="backup"){
    renderBackup(container);
  }
}

/* 7- تنزيل نسخة محفوظة */

function downloadBackup(backupId){
  if(!checkBackupPermission25()) return;

  const backup=(db.backups||[]).find(b=>
    b.id===backupId
  );

  if(!backup){
    showMessage("النسخة غير موجودة");
    return;
  }

  downloadJSON(
    backup,
    "GIFTORA-Backup-"+backupId+".json"
  );
}

/* 8- استرجاع نسخة محفوظة على الجهاز */

function restoreLocalBackup(backupId){
  if(!checkBackupPermission25()) return;

  const backup=(db.backups||[]).find(b=>
    b.id===backupId
  );

  if(!backup || !validateBackupData25(backup.data)){
    showMessage("النسخة غير صالحة أو تالفة");
    return;
  }

  const confirmed=confirm(
    "تحذير: استرجاع النسخة سيستبدل البيانات الحالية. هل تريد المتابعة؟"
  );

  if(!confirmed) return;

  const oldBackups=db.backups||[];

  db=JSON.parse(JSON.stringify(backup.data));

  /* الاحتفاظ بقائمة النسخ الموجودة قبل الاسترجاع */
  db.backups=oldBackups;

  saveDatabase();

  logActivity(
    "استرجاع نسخة احتياطية",
    backup.createdAt||backup.id
  );

  alert("تم استرجاع النسخة. سيتم تحديث الصفحة.");

  location.reload();
}

/* 9- استرجاع نسخة من ملف JSON خارجي */

function restoreBackup(){
  if(!checkBackupPermission25()) return;

  const fileInput=document.getElementById("backupFile25");

  if(!fileInput || !fileInput.files.length){
    showMessage("اختر ملف النسخة الاحتياطية أولاً");
    return;
  }

  const file=fileInput.files[0];

  const reader=new FileReader();

  reader.onload=function(event){
    try{
      const imported=JSON.parse(event.target.result);

      const data=imported.data||imported;

      if(!validateBackupData25(data)){
        showMessage("ملف النسخة غير صالح");
        return;
      }

      const confirmed=confirm(
        "سيتم استبدال البيانات الحالية بالبيانات الموجودة في الملف. هل أنت متأكد؟"
      );

      if(!confirmed) return;

      const oldBackups=db.backups||[];

      db=JSON.parse(JSON.stringify(data));
      db.backups=oldBackups;

      saveDatabase();

      logActivity(
        "استرجاع نسخة من ملف خارجي",
        file.name
      );

      alert("تم استرجاع النسخة بنجاح. سيتم تحديث الصفحة.");

      location.reload();

    }catch(error){
      showMessage("تعذر قراءة الملف. تأكد أنه ملف JSON صحيح.");
    }
  };

  reader.onerror=function(){
    showMessage("حدث خطأ أثناء قراءة الملف");
  };

  reader.readAsText(file);
}
